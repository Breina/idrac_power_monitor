name: Tests

# Run by the Release workflow before it tags anything, or by hand.
on:
  workflow_call:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v7.0.1"
      - uses: "actions/setup-python@v7.0.0"
        with:
          python-version: "3.14"
      - run: pip install -r requirements_test.txt
      - run: pytest -q
