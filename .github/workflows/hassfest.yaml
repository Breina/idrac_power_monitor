name: Validate with hassfest

# Run by the Release workflow before it tags anything, or by hand.
on:
  workflow_call:
  workflow_dispatch:

jobs:
  validate:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v7.0.1"
      # Only published from its default branch
      - uses: home-assistant/actions/hassfest@master
