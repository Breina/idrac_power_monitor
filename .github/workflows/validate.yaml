name: Validate

# Run by the Release workflow before it tags anything, or by hand.
on:
  workflow_call:
  workflow_dispatch:

jobs:
  validate-hacs:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v7.0.1"
      - name: HACS validation
        # Its releases are years behind the checks HACS applies today
        uses: "hacs/action@main"
        with:
          category: "integration"
